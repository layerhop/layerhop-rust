[package]
name = "layerhop"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "LayerHop SDK — best-price cross-chain and same-chain swaps through one non-custodial API"
repository = "https://github.com/layerhop/layerhop-rust"
homepage = "https://docs.layerhop.com"
documentation = "https://docs.rs/layerhop"
readme = "README.md"
keywords = ["layerhop", "bridge", "swap", "cross-chain", "solana"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
