name: Release
# Publishes the crate to crates.io when a version tag is pushed.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - id: check
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -fsS -A "layerhop-release (github.com/layerhop/layerhop-rust)" "https://crates.io/api/v1/crates/layerhop/$v" >/dev/null 2>&1; then echo "layerhop $v is already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
